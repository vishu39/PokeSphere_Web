<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="topSphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <circle cx="50" cy="50" r="44" stroke="#2563eb" stroke-width="2" fill="#0f1115" filter="url(#shadow)" />
  
  <!-- Upper hemisphere -->
  <path d="M 10 50 A 40 40 0 0 1 90 50 Z" fill="url(#topSphere)" opacity="0.9" />
  
  <!-- Lower hemisphere -->
  <path d="M 10 50 A 40 40 0 0 0 90 50 Z" fill="#181b22" />
  
  <!-- Center band -->
  <rect x="6" y="46" width="88" height="8" fill="#0b0d11" rx="2" />
  
  <!-- Center button -->
  <circle cx="50" cy="50" r="14" fill="#0b0d11" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="50" cy="50" r="8" fill="url(#glow)" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
</svg>
